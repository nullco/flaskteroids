name: Create Draft Release

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  draft:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Create draft from the merged release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          version=$(python scripts/release.py version)
          tag="v$version"
          python scripts/release.py validate-tag "$tag"
          python scripts/release.py notes > "$RUNNER_TEMP/release-notes.md"
          gh auth setup-git
          existing_tag=$(git ls-remote --tags origin "refs/tags/$tag")
          if [ -n "$existing_tag" ]; then
            echo "Tag $tag already exists; refusing to release a different commit."
            exit 1
          fi
          gh release create "$tag" --draft --title "$tag" \
            --target "$RELEASE_COMMIT" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
