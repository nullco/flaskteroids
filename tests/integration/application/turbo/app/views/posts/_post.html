{% call turbo_frame_tag(post) %}
  <article>
    <h2 class="post-title">{{ post.title }}</h2>
    {{ link_to('Edit post', edit_post_path(post)) }}
    {{ link_to('Open full page', post_path(post), data={'turbo_frame': '_top'}) }}
    {{ button_to('Delete post', post, method='delete') }}
  </article>
{% endcall %}
