[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"*" = ["templates/**/*"]
"flaskteroids" = [".agents/skills/*/SKILL.md"]

[project]
name = "flaskteroids"
version = "0.3.1"
description = "Flask on steroids"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name="Juan Sebastian Quintero" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Operating System :: OS Independent",
  "Framework :: Flask",
]
dependencies = [
    "alembic>=1.20.0",
    "Flask>=3.1.3",
    "sqlalchemy>=2.1.4",
    "celery>=5.6.3",
    "cryptography>=50.0.2",
    "PyYAML>=6.0.3",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35"]

[project.scripts]
flaskteroids = "flaskteroids.cli.flaskteroids:cli"

[project.entry-points."flask.commands"]
test = "flaskteroids.cli.testing:test"
"test:system" = "flaskteroids.cli.testing:test_system"


[tool.flake8]
max-line-length = 120

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "ruff>=0.17.0",
]
