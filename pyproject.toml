[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"*" = ["templates/**/*"]
"flaskteroids" = [".agents/skills/*/SKILL.md"]

[project]
name = "flaskteroids"
version = "0.3.0"
description = "Flask on steroids"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name="Juan Sebastian Quintero" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Framework :: Flask",
]
dependencies = [
	"alembic>=1.15.1",
	"Flask",
	"sqlalchemy",
	"celery",
	"cryptography",
	"PyYAML"
]

[project.optional-dependencies]
test = [
    "playwright>=1.50",
    "pytest>=8",
    "pytest-xdist>=3",
]

[project.scripts]
flaskteroids = "flaskteroids.cli.flaskteroids:cli"

[project.entry-points."flask.commands"]
test = "flaskteroids.cli.testing:test"
"test:system" = "flaskteroids.cli.testing:test_system"


[tool.flake8]
max-line-length = 120

[dependency-groups]
dev = [
    "playwright>=1.50",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3",
    "ruff>=0.10.0",
]
