[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flaskteroids", "flaskteroids.*"]

[tool.setuptools.package-data]
"*" = ["templates/**/*", "templates/.github/workflows/*.mako"]
"flaskteroids" = [".agents/skills/*/SKILL.md"]
"flaskteroids.rich_text" = ["assets/*"]
"flaskteroids.turbo" = ["assets/*"]

[project]
name = "flaskteroids"
version = "0.9.0"
description = "Flask on steroids"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name="Juan Sebastian Quintero" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Operating System :: OS Independent",
  "Framework :: Flask",
]
dependencies = [
    "alembic>=1.20.0",
    "nh3>=0.3.4",
    "Flask>=3.1.3",
    "sqlalchemy>=2.1.4",
    "celery>=5.6.3",
    "cryptography>=50.0.2",
    "PyYAML>=6.0.3",
    "packaging>=24.2",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.35"]

[project.scripts]
flaskteroids = "flaskteroids.cli.flaskteroids:cli"

[project.entry-points."flask.commands"]
test = "flaskteroids.cli.testing:test"
"test:system" = "flaskteroids.cli.testing:test_system"


[tool.ruff]
target-version = "py312"
line-length = 88
fix = false
preview = false
include = ["*.py", "*.pyi", "pyproject.toml"]
extend-exclude = ["build", "dist", "htmlcov", "*.egg-info", "*.mako"]
force-exclude = true

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "W", "I", "B", "UP",
    "BLE001", "S110", "S112", "PLC0415", "PLW1510", "RUF012", "RUF022", "RUF100",
]

# Import-order probes and test-local declarations deliberately import at runtime.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["flaskteroids"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
preview = false
docstring-code-format = false

[tool.mypy]
python_version = "3.12"
files = [
    "flaskteroids/declarations.py",
    "flaskteroids/jobs/adapters.py",
    "tests/typing/queue_adapter_contract.py",
]
explicit_package_bases = true
namespace_packages = true
follow_imports = "silent"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# Celery has no inline types/stubs. Keep this exception at the external boundary;
# project imports still retain their types through follow_imports = "silent".
[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[dependency-groups]
integration = [
    "psycopg[binary]>=3.3",
    "PyMySQL[rsa]>=1.1",
]
dev = [
    "mypy>=2.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "python-dotenv>=1.2",
    "ruff>=0.17.0",
]
