[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"*" = ["templates/**/*"]

[tool.setuptools.packages.find]
include = ["cucurbit*"]

[project]
name = "cucurbit"
version = "0.1.6"
description = "A batteries-included Python MVC framework inspired by Ruby on Rails"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Juan Sebastian Quintero" }
]
keywords = ["flask", "mvc", "framework", "rails", "sqlalchemy", "celery"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Flask",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "alembic>=1.15.1",
  "Flask",
  "python-dotenv>=1.0.1",
  "sqlalchemy",
  "celery",
]

[project.urls]
Homepage = "https://github.com/nullco/cucurbit"
Documentation = "https://nullco.github.io/cucurbit/index.html"
Repository = "https://github.com/nullco/cucurbit"
Issues = "https://github.com/nullco/cucurbit/issues"

[project.scripts]
cucurbit = "cucurbit.cli.cucurbit:cli"


[tool.flake8]
max-line-length = 120

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14.0",
    "ruff>=0.10.0",
]
