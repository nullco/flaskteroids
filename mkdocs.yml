site_name: Flaskteroids
site_url: https://nullco.github.io/flaskteroids
repo_url: https://github.com/nullco/flaskteroids
theme:
  name: material
  logo: assets/brand/icon-small.svg
  favicon: assets/brand/favicon.png
  font:
    text: Lato
    code: JetBrains Mono
  features:
    - content.code.copy

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github-alt

extra_css:
  - assets/stylesheets/brand.css

nav:
  - Introduction: index.md
  - Getting started:
    - Overview: getting_started.md
    - Project structure: project_structure.md
    - Configuration: configuration.md
    - Testing: testing.md
  - Models:
    - Overview: models/index.md
  - Views:
    - Overview: views/index.md
  - Controllers:
    - Overview: controllers/index.md
    - Routing: controllers/routing.md
    - Advanced topics: controllers/advanced.md
  - Other components:
    - CLI: other/cli.md
    - Fields: other/fields.md
    - Forms: other/forms.md
    - Assets: other/assets.md
    - Attachments: other/attachments.md
    - Rich text: other/rich_text.md
    - Background jobs: other/jobs.md
    - Mailers: other/mailers.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
