<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mailer previews{% endblock %} · Flaskteroids</title>
  <link rel="icon" type="image/svg+xml" href="{{ images['favicon'] }}">
  <style>
    body { margin: 0; background: #fafbf8; color: #24282d; font: 16px system-ui, sans-serif; }
    .topbar { background: #100f1b; border-bottom: 2px solid #b1ff53; }
    .topbar-inner { max-width: 1100px; margin: 0 auto; padding: .5rem 1rem; display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap; }
    .brand { display: inline-flex; border-radius: .25rem; }
    .brand img { display: block; width: 224px; max-width: 100%; height: auto; }
    .topbar-title { padding-left: 1.25rem; border-left: 1px solid #343640; color: #b8bbc2; font-size: .875rem; }
    .topbar a:focus-visible { outline: 2px solid #b1ff53; outline-offset: 4px; }
    @media (max-width: 480px) {
      .topbar-inner { gap: 0 .75rem; }
      .brand img { width: 180px; }
      .topbar-title { padding: 0; border: 0; font-size: .8rem; }
    }
    main { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    a { color: #386d14; }
    h1 { font-size: 1.5rem; }
    section, article { background: white; border: 1px solid #ddd; border-radius: .4rem; padding: 1rem; margin: 1rem 0; }
    li { margin: .6rem 0; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: .5rem 1rem; overflow-wrap: anywhere; }
    dt { font-weight: bold; } dd { margin: 0; }
    nav { display: flex; gap: 1rem; margin: 1rem 0; }
    [aria-current="page"] { font-weight: bold; }
    iframe { width: 100%; height: 70vh; border: 1px solid #ddd; background: white; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    .hint { color: #535b63; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('flaskteroids_mail_previews.index') }}">
        <img src="{{ images['logo-horizontal-dark'] }}" width="1120" height="340" alt="Flaskteroids">
      </a>
      <span class="topbar-title">Mailer previews</span>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
